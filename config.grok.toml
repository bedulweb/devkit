disabled_mcp_servers = ["codebase-memory-mcp"]

[cli]
installer = "internal"
show_tips = true

[ui]
max_thoughts_width = 120
fork_secondary_model = "pinkgreen-grok-composer"
yolo = false
compact_mode = true
permission_mode = "always-approve"
theme = "groknight"
vim_mode = false
show_thinking_blocks = true
show_timestamps = true
screen_mode = "fullscreen"
show_timeline = true
render_mermaid = "on"

[models]
default = "pinkgreen-cx-gpt-5.6-terra"
default_reasoning_effort = "medium"
disabled_models = []

[mcp_servers.context7]
command = "bunx"
args = [
    "-y",
    "@upstash/context7-mcp",
    "--api-key",
    "${CONTEXT7_API_KEY}",
]
enabled = true
startup_timeout_sec = 30

[mcp_servers.firecrawl-mcp]
command = "bunx"
args = [
    "-y",
    "firecrawl-mcp",
]
enabled = true

[mcp_servers.firecrawl-mcp.env]
FIRECRAWL_API_KEY = "${FIRECRAWL_API_KEY}"

[mcp_servers.framelink]
command = "bunx"
args = [
    "-y",
    "figma-developer-mcp",
    "--figma-api-key=${FIGMA_API_KEY}",
    "--stdio",
]
enabled = true
startup_timeout_sec = 30

[mcp_servers.framelink.env]
FIGMA_API_KEY = "${FIGMA_API_KEY}"
npm_config_yes = "true"

[mcp_servers.assistant-ui]
command = "bunx"
args = [
    "-y",
    "@assistant-ui/mcp-docs-server",
]
enabled = true
startup_timeout_sec = 30

[mcp_servers.hugeicons]
command = "bunx"
args = [
    "-y",
    "@hugeicons/mcp-server",
]
enabled = true

[mcp_servers.morph-mcp]
command = "${HOME}/.pi/agent/bin/morph-mcp.sh"
args = []
enabled = true

[mcp_servers.morph-mcp.env]
MORPH_API_KEY = "${MORPH_API_KEY}"

[mcp_servers.drawio]
url = "https://mcp.draw.io/mcp"
enabled = true

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp?exaApiKey=${EXA_API_KEY}&tools=web_search_exa,web_search_advanced_exa,web_fetch_exa,deep_researcher_start,deep_researcher_check"
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 600

[mcp_servers.filesystem]
command = "bunx"
args = [
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "${HOME}/projects",
    "${HOME}/linux-devkit",
]
enabled = true
startup_timeout_sec = 30

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"
enabled = true

[mcp_servers.mobbin.headers]
Authorization = "Bearer ${MOBBIN_API_TOKEN}"

[mcp_servers.codebase-memory-mcp]
command = "/home/ujang/.local/bin/codebase-memory-mcp"
args = []
enabled = false

[mcp_servers.rams]
url = "https://worker.rams.ai/mcp"
enabled = true

[mcp_servers.rams.headers]
Authorization = "Bearer ${RAMS_API_KEY}"

[marketplace]
official_marketplace_auto_installed = true
default_skills_installs_purged = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[plugins]
enabled = [
    "firecrawl",
    "chrome-devtools-mcp",
    "superpowers",
]

[features]
telemetry = false
feedback = false

[telemetry]
mixpanel_enabled = false
trace_upload = false

[session]
auto_compact_threshold_percent = 80

[model."pinkgreen-grok-4.5"]
model = "grok-4.5"
base_url = "https://x.pinkgreen.me/v1"
env_key = "PINKGREEN_GROK_45_API_KEY"
name = "PinkGreen · Grok 4.5"
description = "Grok 4.5 via x.pinkgreen.me (g2a) — 500k ctx"
api_backend = "chat_completions"
context_window = 500000
max_completion_tokens = 64000
auto_compact_threshold_percent = 80
reasoning_effort = "xhigh"
supports_reasoning_effort = true
system_prompt_label = "Grok 4.5"
show_model_fingerprint = true
supports_backend_search = true
use_concise = false
agent_type = "grok-build-plan"

[[model."pinkgreen-grok-4.5".reasoning_efforts]]
value = "xhigh"
label = "XHigh"
description = "Maximum reasoning depth"
default = true

[[model."pinkgreen-grok-4.5".reasoning_efforts]]
